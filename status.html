<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#121821">
<title>Project status</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,700;62..125,800&display=swap">
<!-- DJ's live project dashboard (docs/pages/status.md). Its own page: it shares nothing with the app but the passcode on this phone. -->
<style>
/* Layout: Slate scorebug board. Stat tiles first, then short lists. One column folded, two when open. Dark = Midnight, light = Sunday Paper. */
:root {
  --bg: #121821; --card: #1A2230; --raise: #232D3C; --line: #2B3647; --hair: rgba(148,163,184,.13);
  --ink: #ECF1F7; --muted: #A0ACBD; --dim: #8794A8; --head: #CAD3DF;
  --accent: #45A85E; --accent-fill: #3E9E5A; --on-accent: #0C0C0C; --live: #FF5B4E; --warn: #E8B04A;
  --font: "Archivo", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #F1EBDD; --card: #FBF7EE; --raise: #EAE2D0; --line: #D6CCB6; --hair: rgba(60,50,30,.16);
  --ink: #1D1B16; --muted: #5A5447; --dim: #6A6456; --head: #3A362D;
  --accent: #1F3A8A; --accent-fill: #2A4BA8; --on-accent: #FFFFFF; --live: #D92D20; --warn: #9A6400; color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #F1EBDD; --card: #FBF7EE; --raise: #EAE2D0; --line: #D6CCB6; --hair: rgba(60,50,30,.16);
  --ink: #1D1B16; --muted: #5A5447; --dim: #6A6456; --head: #3A362D;
  --accent: #1F3A8A; --accent-fill: #2A4BA8; --on-accent: #FFFFFF; --live: #D92D20; --warn: #9A6400; color-scheme: light; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-weight: 700; font-size: 15px; line-height: 1.3;
  font-variant-numeric: tabular-nums; -webkit-text-size-adjust: 100%; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 14px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: center; gap: 10px; }
.mark { width: 34px; height: 34px; flex: none; border-radius: 8px; background: var(--accent-fill); color: var(--on-accent);
  display: grid; place-items: center; font-weight: 800; font-stretch: 112%; font-size: 19px; }
.top .t { flex: 1; min-width: 0; }
h1 { margin: 0; white-space: nowrap; font-size: 24px; font-weight: 800; font-stretch: 112%; line-height: 1.05; }
.asof { font-size: 12px; color: var(--dim); margin-top: 2px; }
.refresh { height: 44px; padding: 0 14px; border-radius: 8px; background: var(--raise); color: var(--ink); font-size: 14px; font-weight: 800;
  display: inline-flex; align-items: center; gap: 6px; flex: none; }
.refresh[disabled] { color: var(--dim); cursor: default; }
.refresh svg { width: 16px; height: 16px; }
.refresh.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .refresh.spin svg, .pulse { animation: none !important; } }

/* stat tiles */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
@media (min-width: 760px) { .tiles { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.tile { background: var(--card); border-radius: 8px; padding: 10px 12px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.tile .k { font-size: 11px; color: var(--dim); font-stretch: 85%; text-transform: uppercase; letter-spacing: .07em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v { font-size: 30px; font-weight: 800; font-stretch: 66%; line-height: 1; }
.tile .v small { font-size: 17px; color: var(--muted); font-weight: 800; }
.tile .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.hot .v { color: var(--live); }
.tile.you .v { color: var(--accent); }
.tile a { color: inherit; text-decoration: none; }

/* sections */
.cols { display: grid; gap: 0 28px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.col { min-width: 0; }
section { padding-top: 20px; }
h2 { margin: 0 0 6px; font-size: 12px; font-weight: 800; font-stretch: 92%; text-transform: uppercase; letter-spacing: .08em; color: var(--head);
  display: flex; align-items: center; gap: 8px; min-height: 24px; }
h2 .n { color: var(--dim); letter-spacing: .02em; }
h2 .sp { flex: 1; }

.row { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--hair); min-width: 0; min-height: 44px; }
.row:last-child { border-bottom: 0; }
.row .main { flex: 1; min-width: 0; }
.row .ti { font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.chip { display: inline-block; font-size: 10.5px; font-weight: 800; font-stretch: 85%; text-transform: uppercase; letter-spacing: .05em;
  padding: 3px 6px; border-radius: 4px; background: var(--raise); color: var(--muted); white-space: nowrap; flex: none; }
.chip.you { background: var(--accent-fill); color: var(--on-accent); }
.chip.live { background: color-mix(in srgb, var(--live) 16%, var(--card)); color: var(--live); }
.chip.idea { background: color-mix(in srgb, var(--accent) 16%, var(--card)); color: var(--accent); }
.chip.out { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); flex: none; }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }

/* bar chart */
.chart { background: var(--card); border-radius: 8px; padding: 10px 12px 6px; }
.chart svg { display: block; width: 100%; height: 64px; }
.chart .axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--dim); font-stretch: 78%; margin-top: 2px; }

/* releases */
.rel .ver { font-size: 15px; font-weight: 800; font-stretch: 66%; width: 44px; flex: none; }
.rel .tm { font-size: 11px; color: var(--dim); font-stretch: 78%; width: 50px; flex: none; text-align: right; }
.more { min-height: 44px; font-size: 14px; font-weight: 800; color: var(--accent); }

/* feedback */
.seg { display: inline-flex; background: var(--raise); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { min-height: 32px; padding: 0 9px; border-radius: 6px; font-size: 12px; font-weight: 800; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); }
.fb { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--hair); min-width: 0; }
.fb:last-child { border-bottom: 0; }
.fb .main { flex: 1; min-width: 0; }
.fb .q { font-size: 15px; font-weight: 800; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.fb.open .q { -webkit-line-clamp: unset; display: block; }
.row .meta, .fb .meta { font-size: 12px; color: var(--dim); margin-top: 4px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.row .meta { flex-wrap: nowrap; min-width: 0; }
[hidden] { display: none !important; }
@media (max-width: 400px) { h1 { font-size: 21px; } .refresh { padding: 0 11px; } }
.fb .meta .nw { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.fb .dev { font-size: 11px; color: var(--dim); margin-top: 2px; font-style: italic; display: none; }
.fb.open .dev { display: block; }
.thumb { width: 52px; height: 72px; border-radius: 4px; background: var(--raise); flex: none; overflow: hidden; display: grid; place-items: center; color: var(--dim); font-size: 10px; }
.thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.fb.open .thumb { width: 120px; height: auto; max-height: 260px; }
.fb.open .thumb img { height: auto; }
.empty { font-size: 13px; color: var(--dim); padding: 10px 0; }

/* pages grid */
.pages { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
@media (min-width: 420px) { .pages { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.pg { background: var(--card); border-radius: 8px; padding: 8px 10px; min-width: 0; min-height: 52px; display: flex; flex-direction: column; justify-content: space-between; gap: 4px; }
.pg .nm { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pg .st { font-size: 11px; color: var(--dim); display: flex; align-items: center; gap: 5px; font-stretch: 85%; }
.pg.busy { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--live) 45%, transparent); }
.pg .st .ok { color: var(--accent); }

.ops { display: flex; flex-wrap: wrap; gap: 6px; }
.op { background: var(--card); border-radius: 8px; padding: 8px 10px; font-size: 13px; font-weight: 800; }
.op span { display: block; font-size: 11px; color: var(--dim); font-weight: 700; margin-top: 1px; }
.go { font-size: 22px; color: var(--dim); flex: none; padding-left: 4px; }
.note { font-size: 12px; color: var(--dim); margin-top: 8px; }

.livepill { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 999px; background: var(--raise); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--ink); flex: none; }
.livepill.off .dot { background: var(--dim); animation: none; }
.fb.fresh { background: color-mix(in srgb, var(--accent) 9%, transparent); margin: 0 -8px; padding-left: 8px; padding-right: 8px; border-radius: 8px; }
.gate { max-width: 380px; margin: 18vh auto 0; display: flex; flex-direction: column; gap: 12px; }
.gate h1 { white-space: normal; }
.gate p { margin: 0; color: var(--muted); font-size: 14px; }
.gate input { height: 48px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 16px; padding: 0 12px; }
.gate button { height: 48px; border-radius: 8px; background: var(--accent-fill); color: var(--on-accent); font-weight: 800; }
.gate .err { color: var(--live); min-height: 18px; font-size: 13px; }
.thumb.tap { cursor: pointer; }
body { margin: 0; }
img { max-width: 100%; }
.rel .ti { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.person { padding: 10px 0; border-bottom: 1px solid var(--hair); display: flex; gap: 12px; align-items: center; min-width: 0; }
.person:last-child { border-bottom: 0; }
.person .main { flex: 1; min-width: 0; }
.person .nm { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.person .nums { font-size: 12px; color: var(--muted); margin-top: 3px; }
.person .nums b { color: var(--ink); font-weight: 800; font-stretch: 66%; font-size: 15px; }
.person .pgs { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.spark { flex: none; width: 76px; }
.spark svg { display: block; width: 76px; height: 34px; }
.spark div { font-size: 10px; color: var(--dim); text-align: center; font-stretch: 78%; margin-top: 2px; }
.tgl { display: none; margin-top: 10px; min-height: 44px; padding: 0 14px; border-radius: 8px; background: var(--raise); color: var(--ink); font-size: 14px; font-weight: 800; }
.fb.open .tgl { display: inline-block; }
.fb.isdone .q { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap"><div id="app" hidden>
  <header class="top">
    <div class="mark" aria-hidden="true">S</div>
    <div class="t"><h1>Project status</h1><div class="asof" id="asof">Loading…</div></div>
<span class="livepill" id="live"><span class="dot pulse"></span><span id="live-l">Live</span></span>
  </header>

  <div class="tiles" id="tiles"></div>

  <div class="cols">
    <div class="col">
      <section><h2>Waiting on you <span class="n" id="wait-n"></span></h2><div id="waiting"></div></section>
      <section><h2>People <span class="n" id="ppl-n"></span></h2><div id="people"><div class="empty">Loading…</div></div></section>
      <section><h2>Working now <span class="n" id="work-n"></span></h2><div id="working"></div></section>
      <section>
        <h2>Feedback <span class="n" id="fb-n"></span><span class="sp"></span>
          <span class="seg" role="group" aria-label="Filter feedback" id="fb-seg">
            <button type="button" data-k="open" aria-pressed="true">Open</button>
            <button type="button" data-k="done" aria-pressed="false">Addressed</button>
            <button type="button" data-k="all" aria-pressed="false">All</button>
          </span>
        </h2>
        <div id="feedback"><div class="empty">Loading feedback…</div></div>
      </section>
    </div>
    <div class="col">
      <section>
        <h2>Shipped today <span class="n" id="rel-n"></span></h2>
        <div class="chart"><svg id="bars" viewBox="0 0 240 64" preserveAspectRatio="none" role="img" aria-label="Releases per hour today"></svg>
          <div class="axis"><span>12a</span><span>6a</span><span>12p</span><span>6p</span><span>12a</span></div></div>
        <div id="releases"></div>
      </section>
      <section><h2>Pages</h2><div class="pages" id="pages"></div></section>
      <section><h2>Runs on its own</h2>
        <div class="ops">
          <div class="op">Feedback report<span>Daily 7:38 AM</span></div>
          <div class="op">Morning email<span>Each person's time</span></div>
          <div class="op">Scores and slates<span>Every 10 min</span></div>
          <div class="op">Alerts<span>Every minute</span></div>
        </div>
      </section>
    </div>
  </div>
</div>
</div>
<script>
var TZ = "America/Chicago", REPO = "djvillhard-lab/Slate";
var D = { web: "", build: "", buildWith: "", releases: [], hours: [], sheet: [], pages: [], waiting: [], feedback: null, asOf: null };
var fbFilter = "open", relAll = false, shotUrls = {}, commitTimes = {}, commitEtag = "", openFb = {}, seenAt = "";
try { seenAt = localStorage.getItem("slate-status-seen") || ""; } catch (e) {}
var PAGES = [
  ["Today's Slate", "suggestions.md", ["170-slate", "050-slate", "180-worth", "190-rules", "185-thumbs"]],
  ["Betting lines", "best-bets.md", ["175-best"]], ["Matchup", "game.md", ["140-game", "150-game-row", "110-box"]],
  ["Live feed", "live-feed.md", ["145-live", "146-live"]], ["All games", "all-games.md", ["160-all"]],
  ["Teams", null, ["130-teams"]], ["Box Office", null, ["120-box-office"]], ["News", "news.md", ["200-news"]],
  ["On TV", null, ["210-tv"]], ["Notifications", "notifications.md", ["220-notif", "alerts.js", "Notifications"]],
  ["Settings", "settings.md", ["230-settings"]], ["Sign-up", "welcome.md", ["232-welcome", "signup"]],
  ["Morning email", "morning-email.md", ["235-morning", "morning-email"]], ["Feedback", "feedback.md", ["225-feedback", "feedback.js"]],
  ["Team logos", "team-logos.md", ["045-team-logos"]], ["Menu and logo", "menu.md", ["menu", "logo"]]
];

function $(id) { return document.getElementById(id); }
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function tm(iso) { try { return new Date(iso).toLocaleTimeString("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit" }); } catch (e) { return ""; } }
function ago(iso) {
  var m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return "just now"; if (m < 60) return m + "m ago";
  var h = Math.round(m / 60); if (h < 24) return h + "h ago";
  return new Date(iso).toLocaleDateString("en-US", { timeZone: TZ, month: "short", day: "numeric" });
}
function dur(iso) { var m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000)); return m < 60 ? m + "m" : Math.floor(m / 60) + "h " + (m % 60) + "m"; }
function pass() { try { return localStorage.getItem("slate-pass") || localStorage.getItem("slate-status-pass") || ""; } catch (e) { return ""; } }
function txt(path) { return fetch(path + "?t=" + Date.now(), { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(path + " " + r.status); return r.text(); }); }
function api(path, body) { return fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }).then(function (r) { return r.json().then(function (j) { j._status = r.status; return j; }); }); }
function short(s, n) { s = s.replace(/\s+/g, " ").trim(); return s.length <= n ? s : s.slice(0, n - 1).replace(/\s+\S*$/, "") + "…"; }

function tile(k, v, s, cls) {
  var t = el("div", "tile" + (cls ? " " + cls : ""));
  t.appendChild(el("div", "k", k));
  var vv = el("div", "v"); if (typeof v === "string") vv.textContent = v; else vv.appendChild(v); t.appendChild(vv);
  if (s) t.appendChild(el("div", "s", s));
  return t;
}

function render() {
  $("asof").textContent = D.asOf ? "Checked " + tm(D.asOf) + " Central" : "Loading…";
  var fb = D.feedback || [], newFb = fb.filter(function (f) { return f.at > seenAt; }).length;
  var bm = /^(.*) \((\d+)\)/.exec(D.build || "") || [0, D.build || "–", ""];
  var bv = document.createDocumentFragment(); bv.appendChild(document.createTextNode(bm[1] + " ")); bv.appendChild(el("small", null, bm[2] ? "(" + bm[2] + ")" : ""));
  var last = D.releases[0];
  var tiles = $("tiles"); tiles.textContent = "";
  tiles.appendChild(tile("Web", D.web || "–", last && last.at ? "Live since " + tm(last.at) : ""));
  tiles.appendChild(tile("iPhone build", bv, D.buildWith ? "TestFlight · with " + D.buildWith : "TestFlight"));
  tiles.appendChild(tile("Shipped today", String(D.releases.length), "releases"));
  var openFbN = fb.filter(function (f) { return !f.done; }).length;
  tiles.appendChild(tile("Feedback open", D.feedback ? String(openFbN) : "–", D.feedback ? (newFb ? newFb + " new · " : "") + (fb.length - openFbN) + " addressed" : "", openFbN ? "you" : ""));
  tiles.appendChild(tile("Working now", String(D.sheet.length), D.sheet.map(function (s) { return s.area; }).join(", ") || "nobody", D.sheet.length ? "hot" : ""));
  tiles.appendChild(tile("Waiting on you", String(D.waiting.length), "to do", D.waiting.length ? "you" : ""));
  document.title = (openFbN ? "(" + openFbN + ") " : "") + "Project status";

  var w = $("waiting"); w.textContent = ""; $("wait-n").textContent = D.waiting.length || "";
  D.waiting.forEach(function (x) {
    var r = el("div", "row"), m = el("div", "main"), mt = el("div", "meta");
    m.appendChild(el("div", "ti", x.title));
    mt.appendChild(el("span", "chip you", x.tag));
    if (x.tf) mt.appendChild(el("span", "chip out", "TestFlight"));
    if (x.do) mt.appendChild(el("span", null, x.do));
    m.appendChild(mt); r.appendChild(m); w.appendChild(r);
  });
  if (!D.waiting.length) w.appendChild(el("div", "empty", "Nothing waiting on you."));

  var wk = $("working"); wk.textContent = ""; $("work-n").textContent = D.sheet.length || "";
  D.sheet.forEach(function (s) {
    var r = el("div", "row"); r.appendChild(el("span", "dot pulse"));
    var m = el("div", "main"), mt = el("div", "meta"); m.appendChild(el("div", "ti", s.area));
    mt.appendChild(el("span", s.stale ? "chip live" : "chip", s.who + " · " + dur(s.since)));
    if (/ios\//.test(s.files)) mt.appendChild(el("span", "chip out", "TestFlight"));
    if (s.what) { var wt = el("span", "sub", s.what); wt.style.marginTop = "0"; wt.style.minWidth = "0"; wt.style.flex = "1"; mt.appendChild(wt); }
    m.appendChild(mt); r.appendChild(m); wk.appendChild(r);
  });
  if (!D.sheet.length) wk.appendChild(el("div", "empty", "Nobody is signed in. Every page is free."));
  renderPeople(); renderFeedback(); renderReleases(); renderPages();
}

var VIEW = { lineup: "Slate", games: "All games", game: "Matchup", feed: "Live feed", best: "Betting lines", news: "News", tv: "On TV", teams: "Teams", team: "Team page", settings: "Settings", notify: "Notifications", rules: "Slate rules", moments: "Box Office", office: "Box Office" };
function dayKey(off) { var d = new Date(Date.now() - off * 864e5); return new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(d); }
function mins(secs) { var m = Math.round((secs || 0) / 60); return m < 60 ? m + "m" : Math.floor(m / 60) + "h " + (m % 60) + "m"; }
function renderPeople() {
  var box = $("people"); if (!D.people) return;
  box.textContent = ""; $("ppl-n").textContent = D.people.length || "";
  if (!D.people.length) { box.appendChild(el("div", "empty", "No one has opened Slate since counting started. People show up here the next time they open it.")); return; }
  var ns = "http://www.w3.org/2000/svg";
  D.people.forEach(function (p) {
    var days = p.days || {}, t = days[dayKey(0)] || { opens: 0, secs: 0, views: {} };
    var r = el("div", "person"), m = el("div", "main"), nm = el("div", "nm");
    nm.appendChild(el("span", null, p.name || p.id));
    var live = Date.now() - new Date(p.last).getTime() < 4 * 60000;
    nm.appendChild(el("span", live ? "chip live" : "chip", live ? "On now" : ago(p.last)));
    if (p.where) nm.appendChild(el("span", "chip out", p.where === "app" ? "iPhone app" : p.where === "home" ? "Home Screen" : "Browser"));
    m.appendChild(nm);
    var nums = el("div", "nums");
    [[mins(t.secs), " today"], [String(t.opens || 0), t.opens === 1 ? " open" : " opens"], [String((D.claude || {})[p.id] || 0), " summaries"]].forEach(function (x, i) {
      if (i) nums.appendChild(document.createTextNode(" · ")); nums.appendChild(el("b", null, x[0])); nums.appendChild(document.createTextNode(x[1]));
    });
    m.appendChild(nums);
    var tot = {}; for (var i = 0; i < 7; i++) { var dv = (days[dayKey(i)] || {}).views || {}; Object.keys(dv).forEach(function (k) { var n = VIEW[k] || k; tot[n] = (tot[n] || 0) + dv[k]; }); }
    var top = Object.keys(tot).sort(function (a, b) { return tot[b] - tot[a]; }).slice(0, 4);
    if (top.length) { var pg = el("div", "pgs"); top.forEach(function (k) { pg.appendChild(el("span", "chip", k + " " + tot[k])); }); m.appendChild(pg); }
    r.appendChild(m);
    var sp = el("div", "spark"), svg = document.createElementNS(ns, "svg"); svg.setAttribute("viewBox", "0 0 76 34"); svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Minutes a day, last 7 days");
    var vals = []; for (var j = 6; j >= 0; j--) vals.push(((days[dayKey(j)] || {}).secs || 0) / 60);
    var mx = Math.max.apply(null, vals.concat([1]));
    vals.forEach(function (v, k) {
      var h = v ? Math.max(3, v / mx * 30) : 2, rc = document.createElementNS(ns, "rect");
      rc.setAttribute("x", k * 11); rc.setAttribute("width", 9); rc.setAttribute("y", 32 - h); rc.setAttribute("height", h); rc.setAttribute("rx", 1.5);
      rc.setAttribute("fill", v ? (k === 6 ? "var(--accent)" : "var(--muted)") : "var(--raise)");
      var ti = document.createElementNS(ns, "title"); ti.textContent = Math.round(v) + " min"; rc.appendChild(ti); svg.appendChild(rc);
    });
    sp.appendChild(svg); sp.appendChild(el("div", null, "7 days")); r.appendChild(sp);
    box.appendChild(r);
  });
}
function loadPeople() {
  return api("/api/usage/all", { pass: pass() }).then(function (j) { if (j.people) { D.people = j.people; D.claude = j.claude || {}; renderPeople(); } }).catch(function () {});
}

function renderFeedback() {
  var box = $("feedback"); box.textContent = "";
  if (!D.feedback) { box.appendChild(el("div", "empty", "Loading feedback…")); $("fb-n").textContent = ""; return; }
  var list = D.feedback.filter(function (f) { return fbFilter === "all" || (fbFilter === "done") === !!f.done; });
  var nOpen = D.feedback.filter(function (f) { return !f.done; }).length;
  $("fb-n").textContent = nOpen + " open";
  if (!list.length) box.appendChild(el("div", "empty", fbFilter === "open" ? "Everything has been addressed." : "Nothing here yet."));
  list.forEach(function (f) {
    var c = el("div", "fb" + (f.done ? " isdone" : "") + (f.at > seenAt && !f.done ? " fresh" : "") + (openFb[f.id] ? " open" : "")); c.tabIndex = 0; c.setAttribute("role", "button"); c.setAttribute("aria-expanded", openFb[f.id] ? "true" : "false");
    var m = el("div", "main");
    m.appendChild(el("div", "q", "“" + f.text + "”"));
    var meta = el("div", "meta");
    if (!f.reported) { var nw = el("span", "nw"); nw.title = "Not in a daily report yet"; meta.appendChild(nw); }
    meta.appendChild(el("span", f.kind === "bug" ? "chip live" : f.kind === "idea" ? "chip idea" : "chip", f.kind === "bug" ? "Problem" : f.kind === "idea" ? "Idea" : "Other"));
    meta.appendChild(el("span", null, [f.name, f.page, ago(f.at)].filter(Boolean).join(" · ")));
    m.appendChild(meta);
    if (f.done) { var dn = el("div", "meta"); dn.appendChild(el("span", "chip idea", "✓ Addressed")); dn.appendChild(el("span", null, [f.done.note, f.done.version ? "in " + f.done.version : "", f.done.by === "claude" ? "marked by Claude" : ""].filter(Boolean).join(" · "))); m.appendChild(dn); }
    var dev = (f.device || "").replace(", side column", ""), app = f.app || "";
    app = /^iPhone app/.test(app) ? app.replace("iPhone app build", "build") : (f.version ? "Web " + f.version : app);
    m.appendChild(el("div", "dev", [f.detail, dev, app].filter(Boolean).join(" · ")));
    var tgl = el("button", "tgl", f.done ? "Open it again" : "Mark addressed"); tgl.type = "button";
    tgl.addEventListener("click", function (e) {
      e.stopPropagation(); tgl.disabled = true; tgl.textContent = "Saving…";
      api("/api/feedback/done", { pass: pass(), id: f.id, done: !f.done }).then(function (j) {
        if (!j.ok) throw new Error(); f.done = j.done; openFb[f.id] = false; render();
      }).catch(function () { tgl.disabled = false; tgl.textContent = "Didn't save. Try again"; });
    });
    tgl.addEventListener("keydown", function (e) { e.stopPropagation(); });
    m.appendChild(tgl);
    c.appendChild(m);
    var th = null;
    if (f.shot) { th = el("div", "thumb", "pic"); c.appendChild(th); if (shotUrls[f.id]) putShot(th, f.id); }
    function tog() { openFb[f.id] = c.classList.toggle("open"); c.setAttribute("aria-expanded", openFb[f.id] ? "true" : "false"); if (openFb[f.id] && th) loadShot(f.id, th); }
    c.addEventListener("click", tog);
    c.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tog(); } });
    box.appendChild(c);
    if (th && !shotUrls[f.id]) loadShot(f.id, th);
  });
}
function putShot(holder, id) { holder.textContent = ""; var i = new Image(); i.alt = "Screenshot sent with this feedback"; i.src = shotUrls[id]; holder.appendChild(i); }
var shotBusy = {};
function loadShot(id, holder) {
  if (shotUrls[id]) return putShot(holder, id);
  if (shotBusy[id]) return; shotBusy[id] = 1;
  api("/api/feedback/shot", { pass: pass(), id: id }).then(function (j) { if (j.shot && /^data:image\//.test(j.shot)) { shotUrls[id] = j.shot; renderFeedback(); } }).catch(function () { delete shotBusy[id]; });
}

function renderReleases() {
  var rs = D.releases; $("rel-n").textContent = rs.length || "";
  var svg = $("bars"), h = D.hours, max = Math.max.apply(null, h.concat([1])), ns = "http://www.w3.org/2000/svg";
  svg.textContent = "";
  var nowH = +new Date().toLocaleString("en-US", { timeZone: TZ, hour: "numeric", hour12: false }) % 24;
  for (var i = 0; i < 24; i++) {
    var v = h[i] || 0, bh = v ? Math.max(4, (v / max) * 56) : 2;
    var r = document.createElementNS(ns, "rect");
    r.setAttribute("x", i * 10 + 1); r.setAttribute("width", 8); r.setAttribute("y", 62 - bh); r.setAttribute("height", bh); r.setAttribute("rx", 1.5);
    r.setAttribute("fill", v ? "var(--accent)" : (i > nowH ? "var(--hair)" : "var(--raise)"));
    var t = document.createElementNS(ns, "title"); t.textContent = v + " release" + (v === 1 ? "" : "s"); r.appendChild(t);
    svg.appendChild(r);
  }
  var box = $("releases"); box.textContent = "";
  if (!rs.length) box.appendChild(el("div", "empty", "Nothing shipped yet today."));
  (relAll ? rs : rs.slice(0, 8)).forEach(function (x) {
    var r = el("div", "row rel");
    r.appendChild(el("span", "ver", x.v));
    var m = el("div", "main"); m.appendChild(el("div", "ti", x.text)); if (x.area) m.appendChild(el("div", "sub", x.area)); r.appendChild(m);
    if (x.app) r.appendChild(el("span", "chip out", "New build"));
    r.appendChild(el("span", "tm", x.at ? tm(x.at) : ""));
    box.appendChild(r);
  });
  if (rs.length > 8) { var b = el("button", "more", relAll ? "Show fewer" : "Show all " + rs.length); b.type = "button"; b.onclick = function () { relAll = !relAll; renderReleases(); }; box.appendChild(b); }
}

function renderPages() {
  var g = $("pages"); g.textContent = "";
  D.pages.forEach(function (p) {
    var c = el("div", "pg" + (p.busy ? " busy" : ""));
    c.appendChild(el("div", "nm", p.name));
    var st = el("div", "st");
    if (p.busy) { st.appendChild(el("span", "dot pulse")); st.appendChild(el("span", null, "Working")); }
    else if (p.open) st.appendChild(el("span", null, p.open + " open"));
    else if (p.note) st.appendChild(el("span", "ok", "✓ Clear"));
    else st.appendChild(el("span", null, "No notes"));
    if (p.note && !p.busy) st.appendChild(el("span", null, "· " + p.note));
    c.appendChild(st); g.appendChild(c);
  });
}

$("fb-seg").addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b) return; fbFilter = b.dataset.k;
  Array.prototype.forEach.call(this.querySelectorAll("button"), function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
  renderFeedback();
});

// ---- data ----
var changelogRaw = "";
function todayLabel() { return new Date().toLocaleDateString("en-US", { timeZone: TZ, month: "short", day: "numeric", year: "numeric" }); }
function buildReleases() {
  var re = /^## (\d+\.\d+\.\d+) \(([^)]+)\)\n([\s\S]*?)(?=^## |$(?![\s\S]))/gm, m, all = [], today = todayLabel();
  while ((m = re.exec(changelogRaw))) {
    var tf = /TestFlight: ([^\n]+)/.exec(m[3]), bullets = m[3].match(/^- .+$/gm) || [];
    all.push({ v: m[1], date: m[2], tf: tf ? tf[1].trim() : "", first: (bullets[0] || "").replace(/^- /, "").replace(/\*\*|`/g, "") });
  }
  if (!all.length) return;
  D.web = all[0].v;
  var b = all.filter(function (e) { return e.tf && e.tf.indexOf("no new build") < 0; })[0];
  D.build = b ? b.tf : ""; D.buildWith = b ? b.v : "";
  var hours = []; for (var i = 0; i < 24; i++) hours.push(0);
  D.releases = all.filter(function (e) { return e.date === today; }).map(function (e) {
    var c = commitTimes[e.v], area = "", text = "";
    if (c) { var s = c.subj.replace(/^(DJ|Drew):\s*/, "").replace(/^\d+\.\d+\.\d+:\s*/, ""); var k = s.indexOf(": "); if (k > 0) { area = s.slice(0, k); text = s.slice(k + 2); } else text = s; }
    if (!text) { var f = e.first, k2 = f.slice(0, 40).indexOf(": "); if (k2 > 0) { area = f.slice(0, k2); text = f.slice(k2 + 2); } else text = f; }
    if (c && new Date(c.at).toLocaleDateString("en-US", { timeZone: TZ, month: "short", day: "numeric", year: "numeric" }) === today) { var hh = +new Date(c.at).toLocaleString("en-US", { timeZone: TZ, hour: "numeric", hour12: false }) % 24; hours[hh]++; }
    return { v: e.v, at: c ? c.at : null, area: area, text: short(text.charAt(0).toUpperCase() + text.slice(1), 90), app: !!e.tf && e.tf.indexOf("no new build") < 0 };
  });
  D.hours = hours;
}
function loadRepo() {
  var jobs = [
    txt("/CHANGELOG.md").then(function (t) { changelogRaw = t; }),
    txt("/docs/WORKING-ON.md").then(function (t) {
      D.sheet = t.split("\n").map(function (line) {
        var c = line.trim().replace(/^\||\|$/g, "").split("|").map(function (x) { return x.trim(); });
        if (c.length !== 4 || !/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}/.test(c[3])) return null;
        var since = new Date(c[3].replace(" ", "T") + ":00Z"), k = c[1].indexOf(":");
        return { who: c[0], area: k > 0 ? c[1].slice(0, k).trim() : c[1], what: k > 0 ? c[1].slice(k + 1).trim() : "", files: c[2], since: since.toISOString(), stale: Date.now() - since.getTime() > 864e5 };
      }).filter(Boolean);
    }),
    txt("/docs/status-waiting.json").then(function (t) { D.waiting = JSON.parse(t); }).catch(function () {}),
    Promise.all(PAGES.map(function (p) {
      if (!p[1]) return { name: p[0], note: null, open: 0, keys: p[2] };
      return txt("/docs/pages/" + p[1]).then(function (t) {
        var m = /Last updated:[^\n]*?(\d+\.\d+\.\d+)/.exec(t) || /(\d+\.\d+\.\d+)/.exec(t);
        var o = /^## (?:Open|What.s open)[^\n]*\n([\s\S]*?)(?=^## |$(?![\s\S]))/m.exec(t);
        var open = o ? o[1].split("\n").filter(function (l) { return /^- /.test(l) && l.indexOf("Nothing") < 0; }).length : 0;
        return { name: p[0], note: m ? m[1] : "yes", open: open, keys: p[2] };
      }).catch(function () { return { name: p[0], note: null, open: 0, keys: p[2] }; });
    })).then(function (ps) { D._pages = ps; })
  ];
  return Promise.all(jobs.map(function (j) { return j.catch(function () {}); })).then(function () {
    D.pages = (D._pages || []).map(function (p) {
      var busy = D.sheet.some(function (s) { var hay = (s.area + " " + s.files).toLowerCase(); return p.keys.some(function (k) { return hay.indexOf(k.toLowerCase()) >= 0; }); });
      return { name: p.name, note: p.note, open: p.open, busy: busy };
    });
    buildReleases(); D.asOf = new Date().toISOString(); render();
  });
}
// when each release landed: GitHub's public commit list (unchanged answers don't count against its hourly limit)
function loadCommits() {
  var since = new Date(Date.now() - 36 * 3600e3).toISOString();
  return fetch("https://api.github.com/repos/" + REPO + "/commits?sha=main&per_page=100&since=" + since, { headers: commitEtag ? { "If-None-Match": commitEtag } : {} }).then(function (r) {
    if (r.status !== 200) return;
    commitEtag = r.headers.get("etag") || "";
    return r.json().then(function (list) {
      list.forEach(function (c) {
        var msg = c.commit.message, subj = msg.split("\n")[0], m = /\bWeb (\d+\.\d+\.\d+)/.exec(msg) || /^(\d+\.\d+\.\d+):/.exec(subj);
        if (m && !commitTimes[m[1]]) commitTimes[m[1]] = { at: c.commit.committer.date, subj: subj };
      });
      buildReleases(); render();
    });
  }).catch(function () {});
}
function loadFeedback() {
  return api("/api/feedback/inbox", { pass: pass(), all: true }).then(function (j) {
    if (j._status === 403) { gate("That passcode can't read feedback. Use DJ's."); return; }
    if (!j.items) throw new Error("no items");
    D.feedback = j.items.filter(function (i) { return !i.error; }).reverse();
    $("live").classList.remove("off"); $("live-l").textContent = "Live";
    render();
  }).catch(function () { $("live").classList.add("off"); $("live-l").textContent = "Offline"; });
}
function markSeen() { if (D.feedback && D.feedback[0] && document.visibilityState === "visible") { var top = D.feedback[0].at; setTimeout(function () { seenAt = top; try { localStorage.setItem("slate-status-seen", top); } catch (e) {} }, 8000); } }

var started = false, timers = [];
function start() {
  if (started) return; started = true;
  $("app").hidden = false; var g = $("gate"); if (g) g.remove();
  render();
  loadFeedback().then(markSeen); loadRepo().then(loadCommits); loadPeople();
  timers.push(setInterval(function () { if (document.visibilityState === "visible") loadPeople(); }, 30000));
  timers.push(setInterval(function () { if (document.visibilityState === "visible") loadFeedback().then(markSeen); }, 10000));
  timers.push(setInterval(function () { if (document.visibilityState === "visible") loadRepo(); }, 30000));
  timers.push(setInterval(function () { if (document.visibilityState === "visible") loadCommits(); }, 120000));
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") { loadFeedback().then(markSeen); loadRepo().then(loadCommits); } });
}
function gate(msg) {
  started = false; timers.forEach(clearInterval); timers = [];
  $("app").hidden = true; if ($("gate")) { $("gate-err").textContent = msg || ""; return; }
  var g = el("form", "gate"); g.id = "gate";
  g.appendChild(el("h1", null, "Project status"));
  g.appendChild(el("p", null, "For DJ only. Enter your Slate passcode."));
  var i = el("input"); i.type = "password"; i.id = "gate-pass"; i.autocomplete = "current-password"; i.setAttribute("aria-label", "Slate passcode"); g.appendChild(i);
  var b = el("button", null, "Open"); b.type = "submit"; g.appendChild(b);
  var er = el("div", "err", msg || ""); er.id = "gate-err"; g.appendChild(er);
  g.addEventListener("submit", function (e) {
    e.preventDefault(); var p = i.value.trim(); if (!p) return;
    er.textContent = "Checking…";
    api("/api/feedback/inbox", { pass: p, all: false }).then(function (j) {
      if (j._status === 403 || !j.items) { er.textContent = "That passcode didn't work."; return; }
      try { localStorage.setItem("slate-status-pass", p); } catch (x) {}
      start();
    }).catch(function () { er.textContent = "Couldn't reach Slate. Try again."; });
  });
  document.querySelector(".wrap").appendChild(g);
}
if (pass()) start(); else gate();
