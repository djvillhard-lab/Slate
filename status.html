<script>
// Slate's theme and accent, when this browser has them from the app; otherwise the browser's light or dark
(function () { try {
  var A = { green: ["#45A85E", "#3E9E5A", "#24603A", "#0C0C0C"], teal: ["#3CCFBE", "#26B3A3", "#156A60", "#06201C"], sky: ["#5CB8F5", "#3AA2E8", "#1C5F8F", "#06192A"], coral: ["#FF8A70", "#F2704F", "#93402A", "#1E0C06"], gold: ["#E9B949", "#DCA72E", "#7A5A12", "#1A1203"], silver: ["#C9D3DF", "#B8C3D1", "#4F5B6B", "#11161D"], navy: ["#8FA8FF", "#2A4BA8", "#1F3A8A", "#FFFFFF"] };
  var st = null;
  Object.keys(localStorage).forEach(function (k) { if (/^slate-doc:.*\/settings$/.test(k)) { try { var d = JSON.parse(localStorage.getItem(k)); if (d && d.look) st = d; } catch (e) {} } });
  if (!st) return;
  var light = st.look === "paper", r = document.documentElement, a = A[st.accent];
  r.setAttribute("data-theme", light ? "light" : "dark");
  if (a) { r.style.setProperty("--accent", light ? a[2] : a[0]); r.style.setProperty("--accent-fill", a[1]); r.style.setProperty("--on-accent", a[3]); }
} catch (e) {} })();
</script>
<!-- DJ's live project dashboard (docs/pages/status.md). Its own page: it shares nothing with the app but the passcode on this phone. -->
<style>
/* Slate's own look (docs/DESIGN.md): navy night base or Sunday Paper, Archivo at different widths, small sharp corners,
   hairlines between rows, red = live, accent = yours. Sentence case everywhere. The theme and accent follow Slate's
   setting on this browser when there is one, else the browser's light or dark. */
:root {
  --bg: #121821; --card: #1A2230; --raise: #232D3C; --line: #2B3647; --hair: rgba(148,163,184,.13);
  --ink: #ECF1F7; --muted: #A0ACBD; --dim: #8794A8; --head: #CAD3DF;
  --accent: #45A85E; --accent-fill: #3E9E5A; --on-accent: #0C0C0C; --live: #FF5B4E; --shadow: rgba(0,0,0,.5);
  --font: "Archivo", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme]) {
  --bg: #F1EBDD; --card: #FBF7EE; --raise: #EAE2D0; --line: #D6CCB6; --hair: rgba(60,50,30,.16);
  --ink: #1D1B16; --muted: #5A5447; --dim: #6A6456; --head: #3A362D;
  --accent: #1F3A8A; --accent-fill: #2A4BA8; --on-accent: #FFFFFF; --live: #D92D20; --shadow: rgba(40,30,10,.25); color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #F1EBDD; --card: #FBF7EE; --raise: #EAE2D0; --line: #D6CCB6; --hair: rgba(60,50,30,.16);
  --ink: #1D1B16; --muted: #5A5447; --dim: #6A6456; --head: #3A362D;
  --accent: #1F3A8A; --accent-fill: #2A4BA8; --on-accent: #FFFFFF; --live: #D92D20; --shadow: rgba(40,30,10,.25); color-scheme: light; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-weight: 700; font-size: 16px; line-height: 1.3;
  font-variant-numeric: tabular-nums; -webkit-text-size-adjust: 100%; }
img { max-width: 100%; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1480px; margin: 0 auto; padding-top: calc(env(safe-area-inset-top, 0px) + 10px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 40px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header: the Slate mark level with the page name, the day under it, then the hairline (060-header.css) */
.top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 12px; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--hair); }
.top .brand { width: 42px; height: 42px; color: var(--accent); margin: 0 -4px 0 -2px; }
h1 { margin: 0; font-size: clamp(22px, 6.6vw, 28px); font-weight: 800; font-stretch: 118%; letter-spacing: -.015em; line-height: 1.05; overflow-wrap: anywhere; }
.asof { font-size: 15px; color: var(--muted); margin-top: 2px; }
.livepill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--hair); font-size: 13px; font-weight: 800; color: var(--head); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); flex: none; }
.livepill.off .dot { background: var(--dim); animation: none; }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none !important; } .ghost { transition: none !important; } }

/* the six numbers */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
@media (min-width: 560px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1000px) { .tiles { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.tile { background: var(--card); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.tile .k { font-size: 13px; color: var(--muted); }
.tile .v { font-size: 30px; font-weight: 800; font-stretch: 66%; line-height: 1.05; margin-top: 2px; }
.tile .v small { font-size: 18px; color: var(--muted); font-weight: 800; }
.tile .s { font-size: 13px; color: var(--dim); margin-top: 1px; overflow-wrap: anywhere; }
.tile.hot .v { color: var(--live); }
.tile.you .v { color: var(--accent); }

/* the grid: a full-width row on top, then columns. A card stays in the spot it was dropped in. */
.grid { margin-top: 12px; }
.zone { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.zone[data-zone="top"] { margin-bottom: 12px; }
.zcols { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.grid.c2 .zcols { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.c3 .zcols { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.c2 .zone[data-zone="top"], .grid.c3 .zone[data-zone="top"] { flex-direction: row; align-items: flex-start; }
.grid.c2 .zone[data-zone="top"] > section, .grid.c3 .zone[data-zone="top"] > section { flex: 1 1 0; }
.zone:empty { display: none; }
/* arranging (while a card is being dragged): every card shrinks to its title bar so the whole layout fits on screen,
   each column and the wide row is one big outlined drop area, and the accent slot is where the card will land */
.grid.dragon .zone { display: flex; min-height: 132px; outline: 2px dashed var(--line); outline-offset: 4px; border-radius: 8px; position: relative; }
.grid.dragon .zcols { align-items: stretch; }
.grid.dragon .zone[data-zone="top"] { min-height: 52px; margin-bottom: 20px; }
.grid.c1.dragon .zone[data-zone="top"] { display: none; }
.grid.dragon .zone.over { outline-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.grid.dragon .zone:empty::before { content: "Drop here"; margin: auto; color: var(--dim); font-size: 13px; font-weight: 700; }
.grid.dragon .zone[data-zone="top"]:empty::before { content: "Wide row: drop here for a full-width card"; }
.grid.dragon .zone > section { padding-bottom: 0; flex: none; }
.grid.c2.dragon .zone[data-zone="top"] > section, .grid.c3.dragon .zone[data-zone="top"] > section { flex: 1 1 0; }
.grid.dragon .zone > section > :not(h2), .ghost > :not(h2) { display: none !important; }
.grid.dragon .cbtn, .ghost .cbtn { display: none; }
.zone > section.landed { animation: landed .9s ease-out; }
@keyframes landed { from { box-shadow: 0 0 0 2px var(--accent); } to { box-shadow: 0 0 0 2px transparent; } }
@media (prefers-reduced-motion: reduce) { .zone > section.landed { animation: none; } }

.zone > section, .ghost { background: var(--card); border-radius: 8px; padding: 0 12px 10px; min-width: 0; }
.zone > section.folded { padding-bottom: 0; }
.zone > section.folded > :not(h2) { display: none !important; }
.zone > section.ph { background: color-mix(in srgb, var(--accent) 14%, transparent); box-shadow: inset 0 0 0 2px var(--accent); }
.zone > section.ph > * { visibility: hidden; }
.ghost { position: fixed; z-index: 50; pointer-events: none; margin: 0; padding-bottom: 0; box-shadow: 0 14px 34px var(--shadow), 0 0 0 1px var(--hair); transform: scale(1.02) rotate(.4deg); opacity: .96; overflow: hidden; }
body.dragging { user-select: none; -webkit-user-select: none; cursor: grabbing; }
section > h2 { margin: 0; min-height: 48px; display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 800; font-stretch: 112%; color: var(--ink); letter-spacing: .005em; }
section > h2 .ct { line-height: 1.15; padding: 6px 0; overflow-wrap: break-word; min-width: 0; }
section > h2 .n { font-size: 13px; font-weight: 700; font-stretch: 100%; color: var(--dim); white-space: nowrap; margin-left: 2px; }
section > h2 .sp { flex: 1; }
.grip { width: 40px; height: 48px; margin-left: -12px; display: grid; place-items: center; color: var(--dim); cursor: grab; touch-action: none; flex: none; }
.grip svg { width: 14px; height: 18px; }
.cbtn { width: 40px; height: 44px; display: grid; place-items: center; color: var(--dim); flex: none; }
.cbtn:last-of-type { margin-right: -10px; }
@media (hover: hover) and (pointer: fine) { section > h2 { cursor: grab; } section > h2 .cbtn { cursor: pointer; } }
section { position: relative; }
.mv { position: absolute; z-index: 20; right: 8px; top: 46px; background: var(--raise); border-radius: 8px; padding: 6px; box-shadow: 0 10px 28px var(--shadow), 0 0 0 1px var(--hair); display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 232px; }
.mv button { min-height: 44px; border-radius: 4px; background: var(--card); color: var(--ink); font-size: 14px; font-weight: 700; padding: 0 8px; }
.mv button.wide { grid-column: 1 / -1; }
.mv button:disabled { opacity: .35; }
.zone > section.folded > .mv { display: grid !important; }
.cbtn svg { width: 15px; height: 15px; transition: transform .15s ease; }
.folded .cbtn.fold svg { transform: rotate(-90deg); }

/* rows and status tags (.bug) */
.row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--hair); min-width: 0; min-height: 44px; }
.row .main { flex: 1; min-width: 0; }
.row .ti { font-size: 16px; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
.row .sub { font-size: 13px; color: var(--dim); margin-top: 1px; overflow-wrap: anywhere; }
.meta { font-size: 13px; color: var(--dim); margin-top: 4px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.row .meta { min-width: 0; }
.chip { display: inline-block; font-size: 12px; font-weight: 800; font-stretch: 88%; padding: 3px 7px 2px; border-radius: 4px; background: var(--raise); color: var(--ink); white-space: nowrap; flex: none; }
.chip.you { background: var(--accent-fill); color: var(--on-accent); }
.chip.live { background: var(--live); color: #fff; }
.chip.idea { background: color-mix(in srgb, var(--accent) 16%, var(--card)); color: var(--accent); }
.chip.out { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
.empty { font-size: 15px; color: var(--muted); padding: 10px 0; border-top: 1px solid var(--hair); }
.more { min-height: 44px; font-size: 15px; font-weight: 800; color: var(--accent); }

/* shipped today */
.chart { background: var(--raise); border-radius: 8px; padding: 10px 12px 6px; margin-bottom: 4px; }
.chart svg { display: block; width: 100%; height: 64px; }
.chart .axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); font-stretch: 78%; margin-top: 2px; }
.rel { border-top: 0; border-bottom: 1px solid var(--hair); }
.rel:last-of-type { border-bottom: 0; }
.rel .ver { font-size: 18px; font-weight: 800; font-stretch: 66%; width: 50px; flex: none; }
.rel .ti { white-space: normal; }
.rel .tm { font-size: 13px; color: var(--dim); font-stretch: 78%; width: 54px; flex: none; text-align: right; }

/* feedback */
.fbbar { padding: 0 0 10px; }
.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 8px; background: var(--raise); }
.seg button { height: 38px; padding: 0 14px; border-radius: 8px; font-size: 15px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
#feedback { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 8px; }
.fb { display: flex; gap: 10px; background: var(--raise); border-radius: 8px; padding: 12px; min-width: 0; cursor: pointer; align-items: flex-start; }
.fb.fresh { box-shadow: inset 0 0 0 1.5px var(--accent); }
.fb .main { flex: 1; min-width: 0; }
.fb .q { font-size: 17px; font-weight: 800; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.fb.open .q { -webkit-line-clamp: unset; display: block; }
.fb .mo { display: none; font-size: 14px; font-weight: 800; color: var(--accent); padding: 4px 0 2px; }
.fb.long .mo { display: block; }

/* your list */
.yl-h { font-size: 13px; font-weight: 800; color: var(--muted); padding: 10px 0 4px; border-top: 1px solid var(--hair); display: flex; gap: 6px; align-items: baseline; }
.yl-h b { color: var(--dim); font-weight: 700; }
.yl { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; min-width: 0; }
.yl .main { flex: 1; min-width: 0; padding-top: 3px; }
.yl .ti { font-size: 16px; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
.yl .note { font-size: 13px; color: var(--dim); margin-top: 2px; overflow-wrap: anywhere; }
.yl .ck { width: 44px; height: 44px; margin: -6px -8px -6px -10px; flex: none; display: grid; place-items: center; }
.yl .ck i { width: 22px; height: 22px; border-radius: 4px; box-shadow: inset 0 0 0 2px var(--dim); display: grid; place-items: center; color: var(--on-accent); font-style: normal; font-size: 15px; font-weight: 800; line-height: 1; }
.yl.done .ck i { background: var(--accent-fill); box-shadow: none; }
.yl.done .ti { color: var(--dim); font-weight: 700; }
.yl .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.yl .acts button { min-height: 36px; padding: 0 10px; border-radius: 4px; background: var(--raise); color: var(--ink); font-size: 13px; font-weight: 800; }
.yl .acts button.on { background: var(--accent-fill); color: var(--on-accent); }
.yl .acts button.on.work { background: var(--live); color: #fff; }
.yl .why { display: flex; gap: 6px; margin-top: 6px; }
.yl .why input { flex: 1; min-width: 0; height: 40px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 15px; padding: 0 10px; }
.yl .why button { height: 40px; padding: 0 12px; border-radius: 4px; background: var(--accent-fill); color: var(--on-accent); font-size: 14px; font-weight: 800; }
.yl-err { font-size: 13px; color: var(--live); padding: 4px 0; }
.fb.isdone .q { color: var(--muted); }
.fb .chip:not(.live):not(.idea) { background: var(--card); }
.fb .meta .nw { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.fb .dev { font-size: 13px; color: var(--dim); margin-top: 4px; display: none; }
.fb.open .dev { display: block; }
.thumb { width: 52px; height: 72px; border-radius: 4px; background: var(--card); flex: none; overflow: hidden; display: grid; place-items: center; color: var(--dim); font-size: 11px; }
.thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.fb.open .thumb { width: 120px; height: auto; max-height: 260px; }
.fb.open .thumb img { height: auto; }
.tgl { display: none; margin-top: 10px; min-height: 44px; padding: 0 14px; border-radius: 8px; border: 1.5px solid var(--line); color: var(--ink); font-size: 15px; font-weight: 800; }
.fb.open .tgl { display: inline-block; }
#feedback .empty { grid-column: 1 / -1; border-top: 0; padding-top: 0; }

/* pages, people, the jobs */
.pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 6px; }
.pg { background: var(--raise); border-radius: 8px; padding: 8px 10px; min-width: 0; min-height: 54px; display: flex; flex-direction: column; justify-content: space-between; gap: 4px; }
.pg .nm { font-size: 15px; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
.pg .st { font-size: 13px; color: var(--dim); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.pg.busy { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--live) 55%, transparent); }
.pg .st .ok { color: var(--accent); }
.ops { display: flex; flex-wrap: wrap; gap: 6px; }
.op { background: var(--raise); border-radius: 8px; padding: 8px 10px; font-size: 15px; font-weight: 800; }
.op span { display: block; font-size: 13px; color: var(--dim); font-weight: 700; margin-top: 1px; }
.person { padding: 10px 0; border-top: 1px solid var(--hair); display: flex; gap: 12px; align-items: center; min-width: 0; }
.person .main { flex: 1; min-width: 0; }
.person .nm { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.person .nums { font-size: 13px; color: var(--muted); margin-top: 4px; }
.person .nums b { color: var(--ink); font-weight: 800; font-stretch: 66%; font-size: 18px; }
.person .pgs { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.spark { flex: none; width: 76px; }
.spark svg { display: block; width: 76px; height: 34px; }
.spark div { font-size: 11px; color: var(--dim); text-align: center; font-stretch: 78%; margin-top: 2px; }

.closed { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; font-size: 13px; color: var(--dim); }
.closed button { min-height: 44px; padding: 0 12px; border-radius: 8px; background: var(--card); color: var(--ink); font-size: 15px; font-weight: 800; }
.closed button.reset { background: none; color: var(--accent); }

.gate { max-width: 380px; margin: 16vh auto 0; display: flex; flex-direction: column; gap: 12px; }
.gate h1 { white-space: normal; }
.gate p { margin: 0; color: var(--muted); font-size: 15px; }
.gate input { height: 48px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 16px; padding: 0 12px; }
.gate button { height: 48px; border-radius: 8px; background: var(--accent-fill); color: var(--on-accent); font-weight: 800; }
.gate .err { color: var(--live); min-height: 18px; font-size: 13px; }

/* ---- type scale (DJ, Nov 16: "too difficult to just look at the dashboard and see what I want to see").
   Three roles only. Numbers: big, condensed, heavy. Titles: heavy, full ink. Details: regular weight, muted, 14px.
   Everything else was competing because the whole page was bold. Keep new text inside one of these three. */
body { font-weight: 500; }
.tile { padding: 14px 14px 12px; }
.tile .k { font-size: 14px; font-weight: 700; color: var(--muted); }
.tile .v { font-size: 42px; font-weight: 800; line-height: 1; margin-top: 6px; }
.tile .v small { font-size: 20px; }
.tile .s { font-size: 14px; font-weight: 500; color: var(--muted); margin-top: 4px; }
.zone, .zcols { gap: 16px; } .zone[data-zone="top"] { margin-bottom: 16px; } .grid { margin-top: 16px; } .tiles { gap: 10px; }
.zone > section, .ghost { padding: 4px 16px 14px; }
section > h2 { font-size: 20px; min-height: 52px; }
@media (max-width: 480px) { section > h2 { font-size: 18px; } .cbtn { width: 36px; } }
section > h2 .n { font-size: 20px; font-weight: 800; font-stretch: 66%; color: var(--accent); margin-left: 6px; }
.row { padding: 12px 0; }
.row .ti, .yl .ti, .pg .nm, .op { font-size: 17px; font-weight: 800; }
.row .sub, .meta, .yl .note, .pg .st, .op span, .fb .dev, .person .nums, .rel .tm, .empty { font-size: 14px; font-weight: 500; color: var(--muted); }
.chip { font-size: 12px; font-weight: 700; }
.fb { padding: 14px; } .fb .q { font-size: 18px; }
.rel .ver { font-size: 22px; width: 58px; }
.person { padding: 14px 0; } .person .nm { font-size: 18px; }
.person .nums b { font-size: 26px; }
.yl-h { font-size: 14px; font-weight: 800; color: var(--head); padding: 14px 0 6px; }
.yl-h b { color: var(--accent); font-weight: 800; }
.yl { padding: 8px 0; }
.pg { padding: 10px 12px; } .pages { gap: 8px; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); }
.asof { font-size: 14px; font-weight: 500; }

/* live status: says when it last heard from the server, and turns into a warning when updates stop */
.livepill { height: auto; min-height: 34px; padding: 4px 12px; font-size: 14px; font-weight: 800; color: var(--ink); text-align: left; line-height: 1.2; }
.livepill small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }

<script>

function $(id) { return document.getElementById(id); }

function tm(iso) { try { return new Date(iso).toLocaleTimeString("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit" }); } catch (e) { return ""; } }

function render() {

  tiles.appendChild(tile("Working now", String(D.sheet.length), D.sheet.map(function (s) { return s.who; }).filter(function (w, i, a) { return a.indexOf(w) === i; }).join(", ") || "nobody", D.sheet.length ? "hot" : ""));
  var yl = listCounts();
  tiles.appendChild(tile("Your list", String(yl.left), yl.try + " to try · " + yl.rem + " reminders", yl.left ? "you" : ""));
  document.title = (openFbN ? "(" + openFbN + ") " : "") + "Project status";

  renderList();

  var wk = $("working"); wk.textContent = ""; $("work-n").textContent = D.sheet.length || "";
  D.sheet.forEach(function (s) {
    var r = el("div", "row"); r.appendChild(el("span", "dot pulse"));
    var m = el("div", "main"), mt = el("div", "meta"); m.appendChild(el("div", "ti", s.area));
    mt.appendChild(el("span", s.stale ? "chip live" : "chip", s.who + " · " + dur(s.since)));

    if (s.what) { var wt = el("span", "sub", s.what); wt.style.marginTop = "0"; wt.style.minWidth = "0"; wt.style.flex = "1"; mt.appendChild(wt); }
    m.appendChild(mt); r.appendChild(m); wk.appendChild(r);
  });
  if (!D.sheet.length) wk.appendChild(el("div", "empty", "Nobody is signed in. Every page is free."));
  renderPeople(); renderFeedback(); renderReleases(); renderPages();
}

var VIEW = { lineup: "Slate", games: "All games", game: "Matchup", feed: "Live feed", best: "Betting lines", news: "News", tv: "On TV", teams: "Teams", team: "Team page", settings: "Settings", notify: "Notifications", rules: "Slate rules", moments: "Box Office", office: "Box Office" };
function dayKey(off) { var d = new Date(Date.now() - off * 864e5); return new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(d); }
function mins(secs) { var m = Math.round((secs || 0) / 60); return m < 60 ? m + "m" : Math.floor(m / 60) + "h " + (m % 60) + "m"; }
function renderPeople() {

  box.textContent = ""; $("ppl-n").textContent = D.people.length || "";
  if (!D.people.length) { box.appendChild(el("div", "empty", "No one has opened Slate since counting started. People show up here the next time they open it.")); return; }
  var ns = "http://www.w3.org/2000/svg";
  D.people.forEach(function (p) {
    var days = p.days || {}, t = days[dayKey(0)] || { opens: 0, secs: 0, views: {} };
    var r = el("div", "person"), m = el("div", "main"), nm = el("div", "nm");
    nm.appendChild(el("span", null, p.name || p.id));
    var live = Date.now() - new Date(p.last).getTime() < 4 * 60000;
    nm.appendChild(el("span", live ? "chip live" : "chip", live ? "On now" : ago(p.last)));
    if (p.where) nm.appendChild(el("span", "chip out", p.where === "app" ? "iPhone app" : p.where === "home" ? "Home Screen" : "Browser"));
    m.appendChild(nm);
    // the two versions they last ran: Slate itself (the web part, which can be an older saved copy) and the iPhone build
    var vs = el("div", "vers");
    // always both, for everyone: "Slate 3.66.1" and "Apple build 42". Unknown ones say so instead of being left out.
    var wb = p.web && D.web && p.web !== D.web;
    vs.appendChild(el("span", wb ? "chip behind" : p.web ? "chip" : "chip out", p.web ? "Slate " + p.web + (wb ? " \u00b7 behind " + D.web : "") : "Slate version: next time they open it"));
    var bm = /^(\S+)\s*\((\d+)\)/.exec(p.app || ""), newest = (/\((\d+)\)/.exec(D.build || "") || [])[1], ab = bm && newest && bm[2] !== newest;
    vs.appendChild(el("span", ab ? "chip behind" : bm ? "chip" : "chip out",
      bm ? "Apple build " + bm[2] + " \u00b7 app " + bm[1] + (ab ? " \u00b7 behind " + newest : "")
         : p.app ? "Apple build not reported \u00b7 app " + p.app
         : p.where === "app" ? "Apple build: next time they open the app" : "Apple build: none, in a browser"));
    if (vs.firstChild) m.appendChild(vs);
    var nums = el("div", "nums");
    [[mins(t.secs), " today"], [String(t.opens || 0), t.opens === 1 ? " open" : " opens"], [String((D.claude || {})[p.id] || 0), " summaries"]].forEach(function (x, i) {
      if (i) nums.appendChild(document.createTextNode(" · ")); nums.appendChild(el("b", null, x[0])); nums.appendChild(document.createTextNode(x[1]));
    });
    m.appendChild(nums);
    var tot = {}; for (var i = 0; i < 7; i++) { var dv = (days[dayKey(i)] || {}).views || {}; Object.keys(dv).forEach(function (k) { var n = VIEW[k] || k; tot[n] = (tot[n] || 0) + dv[k]; }); }
    var top = Object.keys(tot).sort(function (a, b) { return tot[b] - tot[a]; }).slice(0, 4);
    if (top.length) { var pg = el("div", "pgs"); top.forEach(function (k) { pg.appendChild(el("span", "chip", k + " " + tot[k])); }); m.appendChild(pg); }
    r.appendChild(m);
    var sp = el("div", "spark"), svg = document.createElementNS(ns, "svg"); svg.setAttribute("viewBox", "0 0 76 34"); svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Minutes a day, last 7 days");
    var vals = []; for (var j = 6; j >= 0; j--) vals.push(((days[dayKey(j)] || {}).secs || 0) / 60);
    var mx = Math.max.apply(null, vals.concat([1]));
    vals.forEach(function (v, k) {
      var h = v ? Math.max(3, v / mx * 30) : 2, rc = document.createElementNS(ns, "rect");
      rc.setAttribute("x", k * 11); rc.setAttribute("width", 9); rc.setAttribute("y", 32 - h); rc.setAttribute("height", h); rc.setAttribute("rx", 1.5);
      rc.setAttribute("fill", v ? (k === 6 ? "var(--accent)" : "var(--muted)") : "var(--raise)");
      var ti = document.createElementNS(ns, "title"); ti.textContent = Math.round(v) + " min"; rc.appendChild(ti); svg.appendChild(rc);
    });
    sp.appendChild(svg); sp.appendChild(el("div", null, "7 days")); r.appendChild(sp);
    box.appendChild(r);
  });
}
// ---- Your list: things shipped that DJ hasn't said he's tried, reminders, and things to think about.
// Reminders and ideas are hand-kept in docs/status-list.json; "to try" is every feature release (x.y.0) of the last
// three days. DJ's taps are saved by the worker (/api/usage/marks), so they follow him to any screen and Claude can read them.
var listAll = false, listDone = false, listWhy = "", listErr = "";
function toTry() {
  var days = {}; for (var i = 0; i < 3; i++) days[new Date(Date.now() - i * 864e5).toLocaleDateString("en-US", { timeZone: TZ, month: "short", day: "numeric", year: "numeric" })] = 1;
  return D.all.filter(function (e) { return /\.0$/.test(e.v) && days[e.date]; }).slice(0, 12);   // the newest dozen: a list, not a backlog
}
function listCounts() {
  var t = toTry().filter(function (e) { return !D.marks["rel:" + e.v]; }).length;
  var r = D.list.reminders.filter(function (x) { return !D.marks["todo:" + x.id]; }).length, i = D.list.ideas.filter(function (x) { return !D.marks["todo:" + x.id]; }).length;
  return { try: t, rem: r, ideas: i, left: t + r + i };
}
function setMark(id, m) {
  var prev = D.marks[id]; if (m) D.marks[id] = { v: m.v, note: m.note || "", at: new Date().toISOString() }; else delete D.marks[id];
  listErr = ""; render(); var set = {}; set[id] = m || null;
  api("/api/usage/marks", { pass: pass(), set: set }).then(function (j) { if (!j.ok) throw 0; D.marks = j.marks || {}; render(); })
    .catch(function () { if (prev) D.marks[id] = prev; else delete D.marks[id]; listErr = "That didn't save. Try again."; render(); });
}
function loadMarks() { return api("/api/usage/marks", { pass: pass() }).then(function (j) { if (j.ok && !listWhy) { D.marks = j.marks || {}; render(); } }).catch(function () {}); }
function renderList() {
  var w = $("waiting"), c = listCounts(); w.textContent = ""; $("wait-n").textContent = c.left ? c.left + " left" : "";
  if (listErr) w.appendChild(el("div", "yl-err", listErr));
  function head(t, n) { var h = el("div", "yl-h", t); if (n) h.appendChild(el("b", null, String(n))); w.appendChild(h); }
  function todo(x) {
    var id = "todo:" + x.id, done = !!D.marks[id], r = el("div", "yl" + (done ? " done" : "")), ck = el("button", "ck"), m = el("div", "main");
    ck.type = "button"; ck.setAttribute("role", "checkbox"); ck.setAttribute("aria-checked", done ? "true" : "false"); ck.setAttribute("aria-label", x.title); ck.appendChild(el("i", null, done ? "\u2713" : ""));
    ck.onclick = function () { setMark(id, done ? null : { v: "done" }); };
    m.appendChild(el("div", "ti", x.title));
    if (!done && (x.note || x.tag)) { var n = el("div", "note"); if (x.tag) { n.appendChild(el("span", "chip out", x.tag)); n.appendChild(document.createTextNode(" ")); } n.appendChild(document.createTextNode(x.note || "")); m.appendChild(n); }
    r.appendChild(ck); r.appendChild(m); w.appendChild(r);
  }
  function rel(e) {
    var id = "rel:" + e.v, mk = D.marks[id], r = el("div", "yl" + (mk ? " done" : "")), m = el("div", "main"), a = el("div", "acts");
    var f = e.first, k = f.slice(0, 40).indexOf(": "), area = k > 0 ? f.slice(0, k) : "", text = (k > 0 ? f.slice(k + 2) : f).split(/\. (?=[A-Z])/)[0].replace(/\.$/, "");
    m.appendChild(el("div", "ti", text.charAt(0).toUpperCase() + text.slice(1)));
    m.appendChild(el("div", "note", [area, e.v, e.date.replace(/, \d{4}$/, "")].filter(Boolean).join(" \u00b7 ") + (mk && mk.note ? " \u00b7 \u201c" + mk.note + "\u201d" : "")));
    var like = el("button", mk && mk.v === "like" ? "on" : "", "Tested, I like it"); like.type = "button"; like.onclick = function () { listWhy = ""; setMark(id, mk && mk.v === "like" ? null : { v: "like" }); };
    var work = el("button", mk && mk.v === "work" ? "on work" : "", "Needs work"); work.type = "button"; work.onclick = function () { if (mk && mk.v === "work") { listWhy = ""; setMark(id, null); } else { listWhy = e.v; render(); var i = w.querySelector(".why input"); if (i) i.focus(); } };
    a.appendChild(like); a.appendChild(work); m.appendChild(a);
    if (listWhy === e.v) {
      var y = el("form", "why"), inp = el("input"), sv = el("button", null, "Save"); inp.placeholder = "What's off? (optional)"; inp.maxLength = 300; inp.setAttribute("aria-label", "What needs work"); sv.type = "submit";
      y.onsubmit = function (ev) { ev.preventDefault(); listWhy = ""; setMark(id, { v: "work", note: inp.value.trim() }); }; y.appendChild(inp); y.appendChild(sv); m.appendChild(y);
    }
    r.appendChild(m); w.appendChild(r);
  }
  var tr = toTry(), open = tr.filter(function (e) { return !D.marks["rel:" + e.v]; });
  if (open.length) {
    head("To try", open.length);
    (listAll ? open : open.slice(0, 4)).forEach(rel);
    if (open.length > 4) { var mo = el("button", "more", listAll ? "Show fewer" : "Show all " + open.length); mo.type = "button"; mo.onclick = function () { listAll = !listAll; render(); }; w.appendChild(mo); }
  }
  var rem = D.list.reminders.filter(function (x) { return !D.marks["todo:" + x.id]; }), ideas = D.list.ideas.filter(function (x) { return !D.marks["todo:" + x.id]; });
  if (rem.length) { head("Reminders", rem.length); rem.forEach(todo); }
  if (ideas.length) { head("To think about", ideas.length); ideas.forEach(todo); }
  if (!c.left) w.appendChild(el("div", "empty", "Nothing left on your list."));
  var doneRel = tr.filter(function (e) { return D.marks["rel:" + e.v]; }), doneTodo = D.list.reminders.concat(D.list.ideas).filter(function (x) { return D.marks["todo:" + x.id]; }), dn = doneRel.length + doneTodo.length;
  if (dn) {
    var db = el("button", "more", listDone ? "Hide checked off" : "Show " + dn + " checked off"); db.type = "button"; db.onclick = function () { listDone = !listDone; render(); }; w.appendChild(db);
    if (listDone) { doneRel.forEach(rel); doneTodo.forEach(todo); }
  }
}
function loadPeople() {
  return api("/api/usage/all", { pass: pass() }).then(function (j) { if (j.people) { D.people = j.people; D.claude = j.claude || {}; renderPeople(); } }).catch(function () {});
}

function renderFeedback() {
  var box = $("feedback"); box.textContent = "";
  if (!D.feedback) { box.appendChild(el("div", "empty", "Loading feedback…")); $("fb-n").textContent = ""; return; }
  var list = D.feedback.filter(function (f) { return fbFilter === "all" || (fbFilter === "done") === !!f.done; });
  requestAnimationFrame(function () { Array.prototype.forEach.call(box.querySelectorAll(".fb"), function (c) { var q = c.querySelector(".q"); c.classList.toggle("long", c.classList.contains("open") || q.scrollHeight > q.clientHeight + 2); }); });
  var nOpen = D.feedback.filter(function (f) { return !f.done; }).length;
  $("fb-n").textContent = nOpen + " open";
  if (!list.length) box.appendChild(el("div", "empty", fbFilter === "open" ? "Everything has been addressed." : "Nothing here yet."));
  list.forEach(function (f) {
    var c = el("div", "fb" + (f.done ? " isdone" : "") + (f.at > seenAt && !f.done ? " fresh" : "") + (openFb[f.id] ? " open" : "")); c.tabIndex = 0; c.setAttribute("role", "button"); c.setAttribute("aria-expanded", openFb[f.id] ? "true" : "false");
    var m = el("div", "main");
    m.appendChild(el("div", "q", "“" + f.text + "”"));
    m.appendChild(el("div", "mo", openFb[f.id] ? "Less" : "More"));   // shown only when the quote runs past three lines (measured below)
    var meta = el("div", "meta");
    if (!f.reported) { var nw = el("span", "nw"); nw.title = "Not in a daily report yet"; meta.appendChild(nw); }
    meta.appendChild(el("span", f.kind === "bug" ? "chip live" : f.kind === "idea" ? "chip idea" : "chip", f.kind === "bug" ? "Problem" : f.kind === "idea" ? "Idea" : "Other"));
