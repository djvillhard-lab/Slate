<script>
// Slate's theme and accent, when this browser has them from the app; otherwise the browser's light or dark
(function () { try {
  var A = { green: ["#45A85E", "#3E9E5A", "#24603A", "#0C0C0C"], teal: ["#3CCFBE", "#26B3A3", "#156A60", "#06201C"], sky: ["#5CB8F5", "#3AA2E8", "#1C5F8F", "#06192A"], coral: ["#FF8A70", "#F2704F", "#93402A", "#1E0C06"], gold: ["#E9B949", "#DCA72E", "#7A5A12", "#1A1203"], silver: ["#C9D3DF", "#B8C3D1", "#4F5B6B", "#11161D"], navy: ["#8FA8FF", "#2A4BA8", "#1F3A8A", "#FFFFFF"] };
  var st = null;
  Object.keys(localStorage).forEach(function (k) { if (/^slate-doc:.*\/settings$/.test(k)) { try { var d = JSON.parse(localStorage.getItem(k)); if (d && d.look) st = d; } catch (e) {} } });
  if (!st) return;
  var light = st.look === "paper", r = document.documentElement, a = A[st.accent];
  r.setAttribute("data-theme", light ? "light" : "dark");
  if (a) { r.style.setProperty("--accent", light ? a[2] : a[0]); r.style.setProperty("--accent-fill", a[1]); r.style.setProperty("--on-accent", a[3]); }
} catch (e) {} })();

<!-- DJ's live project dashboard (docs/pages/status.md). Its own page: it shares nothing with the app but the passcode on this phone. -->
<style>
/* Slate's own look (docs/DESIGN.md): navy night base or Sunday Paper, Archivo at different widths, small sharp corners,
   hairlines between rows, red = live, accent = yours. Sentence case everywhere. The theme and accent follow Slate's
   setting on this browser when there is one, else the browser's light or dark. */
:root {
  --bg: #121821; --card: #1A2230; --raise: #232D3C; --line: #2B3647; --hair: rgba(148,163,184,.13);
  --ink: #ECF1F7; --muted: #A0ACBD; --dim: #8794A8; --head: #CAD3DF;
  --accent: #45A85E; --accent-fill: #3E9E5A; --on-accent: #0C0C0C; --live: #FF5B4E; --shadow: rgba(0,0,0,.5);
  --font: "Archivo", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme]) {
  --bg: #F1EBDD; --card: #FBF7EE; --raise: #EAE2D0; --line: #D6CCB6; --hair: rgba(60,50,30,.16);
  --ink: #1D1B16; --muted: #5A5447; --dim: #6A6456; --head: #3A362D;
  --accent: #1F3A8A; --accent-fill: #2A4BA8; --on-accent: #FFFFFF; --live: #D92D20; --shadow: rgba(40,30,10,.25); color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #F1EBDD; --card: #FBF7EE; --raise: #EAE2D0; --line: #D6CCB6; --hair: rgba(60,50,30,.16);
  --ink: #1D1B16; --muted: #5A5447; --dim: #6A6456; --head: #3A362D;
  --accent: #1F3A8A; --accent-fill: #2A4BA8; --on-accent: #FFFFFF; --live: #D92D20; --shadow: rgba(40,30,10,.25); color-scheme: light; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-weight: 700; font-size: 16px; line-height: 1.3;
  font-variant-numeric: tabular-nums; -webkit-text-size-adjust: 100%; }
img { max-width: 100%; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1480px; margin: 0 auto; padding-top: calc(env(safe-area-inset-top, 0px) + 10px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 40px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header: the Slate mark level with the page name, the day under it, then the hairline (060-header.css) */
.top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 12px; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--hair); }
.top .brand { width: 42px; height: 42px; color: var(--accent); margin: 0 -4px 0 -2px; }
h1 { margin: 0; font-size: clamp(22px, 6.6vw, 28px); font-weight: 800; font-stretch: 118%; letter-spacing: -.015em; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.asof { font-size: 15px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.livepill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--hair); font-size: 13px; font-weight: 800; color: var(--head); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); flex: none; }
.livepill.off .dot { background: var(--dim); animation: none; }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none !important; } .ghost { transition: none !important; } }

/* the six numbers */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
@media (min-width: 560px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1000px) { .tiles { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.tile { background: var(--card); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.tile .k { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v { font-size: 30px; font-weight: 800; font-stretch: 66%; line-height: 1.05; margin-top: 2px; }
.tile .v small { font-size: 18px; color: var(--muted); font-weight: 800; }
.tile .s { font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.tile.hot .v { color: var(--live); }
.tile.you .v { color: var(--accent); }

/* the grid: a full-width row on top, then columns. A card stays in the spot it was dropped in. */
.grid { margin-top: 12px; }
.zone { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.zone[data-zone="top"] { margin-bottom: 12px; }
.zcols { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.grid.c2 .zcols { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.c3 .zcols { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.c2 .zone[data-zone="top"], .grid.c3 .zone[data-zone="top"] { flex-direction: row; align-items: flex-start; }
.grid.c2 .zone[data-zone="top"] > section, .grid.c3 .zone[data-zone="top"] > section { flex: 1 1 0; }
.zone:empty { display: none; }
.grid.dragon .zone:empty { display: flex; min-height: 64px; border-radius: 8px; box-shadow: inset 0 0 0 2px var(--hair); }
.grid.dragon .zone[data-zone="top"]:empty { min-height: 44px; }

.zone > section, .ghost { background: var(--card); border-radius: 8px; padding: 0 12px 10px; min-width: 0; }
.zone > section.folded { padding-bottom: 0; }
.zone > section.folded > :not(h2) { display: none !important; }
.zone > section.ph { background: transparent; box-shadow: inset 0 0 0 2px var(--accent); }
.zone > section.ph > * { visibility: hidden; }
.ghost { position: fixed; z-index: 50; pointer-events: none; margin: 0; box-shadow: 0 14px 34px var(--shadow), 0 0 0 1px var(--hair); transform: scale(1.02) rotate(.4deg); opacity: .96; overflow: hidden; }
body.dragging { user-select: none; -webkit-user-select: none; cursor: grabbing; }
section > h2 { margin: 0; min-height: 48px; display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 800; font-stretch: 112%; color: var(--ink); letter-spacing: .005em; }
section > h2 .ct { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
section > h2 .n { font-size: 13px; font-weight: 700; font-stretch: 100%; color: var(--dim); white-space: nowrap; margin-left: 2px; }
section > h2 .sp { flex: 1; }
.grip { width: 30px; height: 48px; margin-left: -8px; display: grid; place-items: center; color: var(--dim); cursor: grab; touch-action: none; flex: none; }
.grip svg { width: 14px; height: 18px; }
.cbtn { width: 40px; height: 44px; display: grid; place-items: center; color: var(--dim); flex: none; }
.cbtn:last-child { margin-right: -10px; }
.cbtn svg { width: 15px; height: 15px; transition: transform .15s ease; }
.folded .cbtn.fold svg { transform: rotate(-90deg); }

/* rows and status tags (.bug) */
.row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--hair); min-width: 0; min-height: 44px; }
.row .main { flex: 1; min-width: 0; }
.row .ti { font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.meta { font-size: 13px; color: var(--dim); margin-top: 4px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.row .meta { flex-wrap: nowrap; min-width: 0; }
.chip { display: inline-block; font-size: 12px; font-weight: 800; font-stretch: 88%; padding: 3px 7px 2px; border-radius: 4px; background: var(--raise); color: var(--ink); white-space: nowrap; flex: none; }
.chip.you { background: var(--accent-fill); color: var(--on-accent); }
.chip.live { background: var(--live); color: #fff; }
.chip.idea { background: color-mix(in srgb, var(--accent) 16%, var(--card)); color: var(--accent); }
.chip.out { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
.empty { font-size: 15px; color: var(--muted); padding: 10px 0; border-top: 1px solid var(--hair); }
.more { min-height: 44px; font-size: 15px; font-weight: 800; color: var(--accent); }

/* shipped today */
.chart { background: var(--raise); border-radius: 8px; padding: 10px 12px 6px; margin-bottom: 4px; }
.chart svg { display: block; width: 100%; height: 64px; }
.chart .axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); font-stretch: 78%; margin-top: 2px; }
.rel { border-top: 0; border-bottom: 1px solid var(--hair); }
.rel:last-of-type { border-bottom: 0; }
.rel .ver { font-size: 18px; font-weight: 800; font-stretch: 66%; width: 50px; flex: none; }
.rel .ti { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.rel .tm { font-size: 13px; color: var(--dim); font-stretch: 78%; width: 54px; flex: none; text-align: right; }

/* feedback */
.fbbar { padding: 0 0 10px; }
.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 8px; background: var(--raise); }
.seg button { height: 38px; padding: 0 14px; border-radius: 8px; font-size: 15px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
#feedback { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 8px; }
.fb { display: flex; gap: 10px; background: var(--raise); border-radius: 8px; padding: 12px; min-width: 0; cursor: pointer; align-items: flex-start; }
.fb.fresh { box-shadow: inset 0 0 0 1.5px var(--accent); }
.fb .main { flex: 1; min-width: 0; }
.fb .q { font-size: 17px; font-weight: 800; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.fb.open .q { -webkit-line-clamp: unset; display: block; }
.fb.isdone .q { color: var(--muted); }
.fb .chip:not(.live):not(.idea) { background: var(--card); }
.fb .meta .nw { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.fb .dev { font-size: 13px; color: var(--dim); margin-top: 4px; display: none; }
.fb.open .dev { display: block; }
.thumb { width: 52px; height: 72px; border-radius: 4px; background: var(--card); flex: none; overflow: hidden; display: grid; place-items: center; color: var(--dim); font-size: 11px; }
.thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.fb.open .thumb { width: 120px; height: auto; max-height: 260px; }
.fb.open .thumb img { height: auto; }
.tgl { display: none; margin-top: 10px; min-height: 44px; padding: 0 14px; border-radius: 8px; border: 1.5px solid var(--line); color: var(--ink); font-size: 15px; font-weight: 800; }
.fb.open .tgl { display: inline-block; }
#feedback .empty { grid-column: 1 / -1; border-top: 0; padding-top: 0; }

/* pages, people, the jobs */
.pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 6px; }
.pg { background: var(--raise); border-radius: 8px; padding: 8px 10px; min-width: 0; min-height: 54px; display: flex; flex-direction: column; justify-content: space-between; gap: 4px; }
.pg .nm { font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pg .st { font-size: 13px; color: var(--dim); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.pg.busy { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--live) 55%, transparent); }
.pg .st .ok { color: var(--accent); }
.ops { display: flex; flex-wrap: wrap; gap: 6px; }
.op { background: var(--raise); border-radius: 8px; padding: 8px 10px; font-size: 15px; font-weight: 800; }
.op span { display: block; font-size: 13px; color: var(--dim); font-weight: 700; margin-top: 1px; }
.person { padding: 10px 0; border-top: 1px solid var(--hair); display: flex; gap: 12px; align-items: center; min-width: 0; }
.person .main { flex: 1; min-width: 0; }
.person .nm { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.person .nums { font-size: 13px; color: var(--muted); margin-top: 4px; }
.person .nums b { color: var(--ink); font-weight: 800; font-stretch: 66%; font-size: 18px; }
.person .pgs { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.spark { flex: none; width: 76px; }
.spark svg { display: block; width: 76px; height: 34px; }
.spark div { font-size: 11px; color: var(--dim); text-align: center; font-stretch: 78%; margin-top: 2px; }

.closed { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; font-size: 13px; color: var(--dim); }
.closed button { min-height: 44px; padding: 0 12px; border-radius: 8px; background: var(--card); color: var(--ink); font-size: 15px; font-weight: 800; }
.closed button.reset { background: none; color: var(--accent); }

.gate { max-width: 380px; margin: 16vh auto 0; display: flex; flex-direction: column; gap: 12px; }
.gate h1 { white-space: normal; }
.gate p { margin: 0; color: var(--muted); font-size: 15px; }
.gate input { height: 48px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 16px; padding: 0 12px; }
.gate button { height: 48px; border-radius: 8px; background: var(--accent-fill); color: var(--on-accent); font-weight: 800; }
.gate .err { color: var(--live); min-height: 18px; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap"><div id="app" hidden>
  <header class="top">
    <svg class="brand" viewBox="0 0 24 24" aria-hidden="true"><g transform="translate(-1.8 .3) rotate(35 12 12)" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3.9V21.3" fill="none" stroke-width="2.2" opacity=".55"/><path d="M9.7 18.3h2.6" fill="none" stroke-width="1.7"/><path transform="translate(11 7.4) scale(.88) translate(-11 -7.4)" d="M6.8 5.6H9.2v.4H13l4.8-1.7q1.7 3.1 0 6.2L13 8.8H9.2v.4H6.8a.8.8 0 0 1-.8-.8V6.4a.8.8 0 0 1 .8-.8z" fill="currentColor" stroke-width="2.1"/></g><path d="M21 3.6l.62 1.78 1.78.62-1.78.62-.62 1.78-.62-1.78-1.78-.62 1.78-.62z" fill="currentColor"/><path d="M17.3 2.3l.3.9.9.3-.9.3-.3.9-.3-.9-.9-.3.9-.3z" fill="currentColor" opacity=".8"/></svg>
    <div><h1>Project status</h1><div class="asof" id="asof">Loading…</div></div>

      <section data-card="feedback"><h2>Feedback <span class="n" id="fb-n"></span></h2>
        <div class="fbbar"><span class="seg" role="group" aria-label="Filter feedback" id="fb-seg">
            <button type="button" data-k="open" aria-pressed="true">Open</button>

        <h2>Shipped today <span class="n" id="rel-n"></span></h2>
        <div class="chart"><svg id="bars" viewBox="0 0 240 64" preserveAspectRatio="none" role="img" aria-label="Releases per hour today"></svg>
          <div class="axis"><span>12a</span><span>6a</span><span>12p</span><span>6p</span><span>12a</span></div></div>

        </div>

</div>

<script>
var TZ = "America/Chicago", REPO = "djvillhard-lab/Slate";
var D = { web: "", build: "", buildWith: "", releases: [], hours: [], sheet: [], pages: [], waiting: [], feedback: null, asOf: null };
var fbFilter = "open", relAll = false, shotUrls = {}, commitTimes = {}, commitEtag = "", openFb = {}, seenAt = "";
try { seenAt = localStorage.getItem("slate-status-seen") || ""; } catch (e) {}
var PAGES = [
  ["Today's Slate", "suggestions.md", ["170-slate", "050-slate", "180-worth", "190-rules", "185-thumbs"]],
  ["Betting lines", "best-bets.md", ["175-best"]], ["Matchup", "game.md", ["140-game", "150-game-row", "110-box"]],
  ["Live feed", "live-feed.md", ["145-live", "146-live"]], ["All games", "all-games.md", ["160-all"]],
  ["Teams", null, ["130-teams"]], ["Box Office", null, ["120-box-office"]], ["News", "news.md", ["200-news"]],
  ["On TV", null, ["210-tv"]], ["Notifications", "notifications.md", ["220-notif", "alerts.js", "Notifications"]],
  ["Settings", "settings.md", ["230-settings"]], ["Sign-up", "welcome.md", ["232-welcome", "signup"]],
  ["Morning email", "morning-email.md", ["235-morning", "morning-email"]], ["Feedback", "feedback.md", ["225-feedback", "feedback.js"]],
  ["Team logos", "team-logos.md", ["045-team-logos"]], ["Menu and logo", "menu.md", ["menu", "logo"]]
];

function $(id) { return document.getElementById(id); }
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function tm(iso) { try { return new Date(iso).toLocaleTimeString("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit" }); } catch (e) { return ""; } }
function ago(iso) {
  var m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return "just now"; if (m < 60) return m + "m ago";
  var h = Math.round(m / 60); if (h < 24) return h + "h ago";
  return new Date(iso).toLocaleDateString("en-US", { timeZone: TZ, month: "short", day: "numeric" });
}
function dur(iso) { var m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000)); return m < 60 ? m + "m" : Math.floor(m / 60) + "h " + (m % 60) + "m"; }
function pass() { try { return localStorage.getItem("slate-pass") || localStorage.getItem("slate-status-pass") || ""; } catch (e) { return ""; } }
function txt(path) { return fetch(path + "?t=" + Date.now(), { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(path + " " + r.status); return r.text(); }); }
function api(path, body) { return fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }).then(function (r) { return r.json().then(function (j) { j._status = r.status; return j; }); }); }

var changelogRaw = "";

  while ((m = re.exec(changelogRaw))) {

    all.push({ v: m[1], date: m[2], tf: tf ? tf[1].trim() : "", first: (bullets[0] || "").replace(/^- /, "").replace(/\*\*|`/g, "") });
  }
  if (!all.length) return;
  D.web = all[0].v;
  var b = all.filter(function (e) { return e.tf && e.tf.indexOf("no new build") < 0; })[0];
  D.build = b ? b.tf : ""; D.buildWith = b ? b.v : "";
  var hours = []; for (var i = 0; i < 24; i++) hours.push(0);
  D.releases = all.filter(function (e) { return e.date === today; }).map(function (e) {
    var c = commitTimes[e.v], area = "", text = "";
    if (c) { var s = c.subj.replace(/^(DJ|Drew):\s*/, "").replace(/^\d+\.\d+\.\d+:\s*/, ""); var k = s.indexOf(": "); if (k > 0) { area = s.slice(0, k); text = s.slice(k + 2); } else text = s; }

function loadRepo() {

        if (c.length !== 4 || !/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}/.test(c[3])) return null;
        var since = new Date(c[3].replace(" ", "T") + ":00Z"), k = c[1].indexOf(":");
        return { who: c[0], area: k > 0 ? c[1].slice(0, k).trim() : c[1], what: k > 0 ? c[1].slice(k + 1).trim() : "", files: c[2], since: since.toISOString(), stale: Date.now() - since.getTime() > 864e5 };
      }).filter(Boolean);

    Promise.all(PAGES.map(function (p) {

    D.pages = (D._pages || []).map(function (p) {
