name: Slate tick
# The number work for the Slate app: scores, odds, start times, standings and rankings,
# day slates, Box Office facts and phone alerts. Free on GitHub, every 10 minutes.
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/**", ".github/workflows/tick.yml"]
concurrency:
  group: tick
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Push library
        run: pip install --quiet pywebpush
      - name: Tick
        env:
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
        run: python3 scripts/tick.py
