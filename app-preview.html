<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#121821">
<title>Slate app preview</title>
<style>
  /* A stand-in for the iPhone app on iPhone Duo: the real Slate page on the left, and the control strip
     the app puts in Apple's right-side bar. The buttons call the page the same way the app's buttons do. */
  :root { color-scheme: dark; --bg: #121821; --ink: #EAF0F7; --muted: #94A3B8; --sel: #5FD07C; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  .wrap { position: relative; height: 100dvh; }
  iframe { position: absolute; inset: 0; width: 100%; border: 0; height: 100%; background: var(--bg); }
  /* the strip floats over the page, which runs underneath it (the page keeps its content clear of the buttons) */
  .strip { position: absolute; top: 0; right: 0; bottom: 0; width: 62px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px;
    padding: max(10px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) 6px;
    background: transparent; box-sizing: border-box; }
  .strip button { width: 48px; height: 48px; border-radius: 16px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
  .strip button[aria-current="page"] { color: var(--sel); background: rgba(95,208,124,.12); }
  .strip svg { width: 23px; height: 23px; }
  .tag { font: 600 10px/1.2 system-ui, -apple-system, sans-serif; color: var(--muted); text-align: center; margin-bottom: auto; padding-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <iframe id="app" title="Slate" src="./?native=strip"></iframe>
  <nav class="strip" aria-label="App controls">
    <div class="tag">App<br>preview</div>
    <button type="button" data-go="lineup" aria-label="Slate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 15 9M14 4l1 2.5L17.5 7 15 8l-1 2.5L13 8l-2.5-1L13 6zM19.5 12l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6z"/></svg></button>
    <button type="button" data-go="moments" aria-label="Box Office"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v1.5a2.5 2.5 0 0 0 0 5V16a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1.5a2.5 2.5 0 0 0 0-5z"/></svg></button>
    <button type="button" data-go="teams" aria-label="Teams"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8 3c.3 2 1.9 3.4 4 3.4S15.7 5 16 3l3 1.1v4.6c-1 .9-1.6 2.2-1.6 3.6V21H6.6v-8.7C6.6 10.9 6 9.6 5 8.7V4.1z"/></svg></button>
    <button type="button" data-go="tv" aria-label="On TV"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="13" rx="2"/><path d="M8 21h8" stroke-linecap="round"/></svg></button>
    <button type="button" data-go="games" aria-label="All games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="17" rx="3"/><path d="M3 9.2h18M3 14.8h18M7 6.4h5M7 12h7M7 17.6h4"/></svg></button>
  </nav>
</div>
<script>
  var frame = document.getElementById("app");
  // tell the page how wide the strip is, as the app does
  frame.addEventListener("load", function () { var n = 0, t = setInterval(function () { try { if (frame.contentWindow.SlateApp) { frame.contentWindow.SlateApp.setInset(62); clearInterval(t); } } catch (e) {} if (++n > 40) clearInterval(t); }, 250); });
  // carry a #pass= link through to the page inside
  if (location.hash) frame.src = "./?native=strip" + location.hash;
  document.querySelectorAll("[data-go]").forEach(function (b) {
    b.addEventListener("click", function () {
      light(b.getAttribute("data-go"));  // light it right away; the page's own report follows
      try { frame.contentWindow.SlateApp.go(b.getAttribute("data-go")); } catch (e) {}
    });
  });
  function light(v) { document.querySelectorAll("[data-go]").forEach(function (b) { if (b.getAttribute("data-go") === v) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); }); }
  // the page reports where it is, like it does to the app: light up the matching button
  window.addEventListener("message", function (e) {
    if (e.origin !== location.origin || !e.data || !e.data.slate) return;
    var m = e.data.slate; if (m.t !== "state") return;
    var v = m.view === "team" ? "teams" : m.view;
    if (m.duo && m.view === "lineup") v = "lineup";
    light(v);
    document.documentElement.style.background = m.look === "light" ? "#F2F4F7" : m.look === "black" ? "#000" : "#121821";
  });
</script>
</body>
</html>
