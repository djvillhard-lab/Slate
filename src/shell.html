<script>window.SLATE_BUILD = "{{BUILD}}";
// two-pane mode on the unfolded Duo (3.80.0): each side is this same page in a frame, marked ?pane=a or ?pane=b
window.SLATE_PANE = (function () { try { var m = /[?&]pane=([ab])\b/.exec(location.search); return m && window.parent !== window ? m[1] : ""; } catch (e) { return ""; } })();
(function () {
  // a new version on GitHub: reload onto it without waiting for the phone's cached copy to expire
  var last = 0;
  function check() {
    if (Date.now() - last < 60000) return; last = Date.now();
    fetch("version.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (v) {
      if (!v || !v.build || v.build === window.SLATE_BUILD) return;
      // tried this version in the last 2 minutes (GitHub still publishing): don't loop, but try again later
      try { var tr = JSON.parse(localStorage.getItem("slate-tried") || "{}"); if (tr.b === v.build && Date.now() - tr.at < 120000) return; localStorage.setItem("slate-tried", JSON.stringify({ b: v.build, at: Date.now() })); } catch (e) {}
      // a pane reloads on its own page; the two-pane screen itself waits until it is folded (it would reset both sides)
      if (window.SLATE_PANE) { location.replace(location.pathname + "?pane=" + window.SLATE_PANE + "&v=" + v.build + (location.hash || "")); return; }
      if (document.documentElement.classList.contains("panes")) return;
      location.replace(location.pathname + "?v=" + v.build);
    }, function () {});
  }
  // Settings > Update now: drop the phone's saved copy and load straight from GitHub
  window.slateForceUpdate = function () {
    var go = function () { location.replace(location.pathname + "?v=" + Date.now()); };
    var p = [];
    try { if (window.caches) p.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
    try { if (navigator.serviceWorker) p.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.update().catch(function () {}); })); })); } catch (e) {}
    Promise.all(p).then(go, go); setTimeout(go, 2500);
  };
  setTimeout(check, 1500);
  // the app often stays open for a whole game: look again every 2 minutes, and move to a new version only while
  // Tonight's Slate is showing and the screen hasn't been touched for 20 seconds, so nothing jumps under a finger (3.39.3)
  var touched = Date.now();
  ["touchstart", "scroll", "keydown"].forEach(function (t) { window.addEventListener(t, function () { touched = Date.now(); }, { passive: true, capture: true }); });
  setInterval(function () {
    if (document.hidden || Date.now() - touched < 20000 || document.documentElement.getAttribute("data-view") !== "lineup" || document.documentElement.classList.contains("panes")) return;
    last = 0; check();
  }, 120000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) check(); });
  window.addEventListener("pageshow", function (e) { if (e.persisted) { last = 0; check(); } });
})();</script>
